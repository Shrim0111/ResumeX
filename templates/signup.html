<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
    <link rel="stylesheet" href="../static/login.css">
</head>
<body>
    <body>



  <div class="navbar">
    <div class="logo"><img src="../static/Images/logo (2).png" alt="Logo"><a href="/">Resume Builder</a></div>
    <ul>
      <li><a href="#">Features</a></li>
      <li><a href="#">Templates</a></li>
      <li><a href="#">Pricing</a></li>
    </ul>
    <div class="buttons">
      <a href="/signup" class="btn btn-signin">Sign In</a>
      <a href="/signup" class="btn btn-primary">Get Started Free</a>
    </div>
  </div>

  <div class="form-container">
    <h2>Sign Up</h2>
    <form method="POST" action="/signup">
      <input type="text" name="name" placeholder="Enter you full name" required>
      <input type="text" name="email" placeholder="Enter your email" required> 
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <a href="/loginf">Already have an account? Login</a>
  </div>
</body>
</html>

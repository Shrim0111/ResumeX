<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
<link rel="stylesheet" href="../static/login.css">
  
</head>
<body>
  
  <div class="navbar">
    <div class="logo"><img src="../static/Images/logo (2).png" alt="Logo"><a href="/">Resume Builder</a></div>
    <ul>
      <li><a href="#">Features</a></li>
      <li><a href="#">Templates</a></li>
      <li><a href="#">Pricing</a></li>
    </ul>
    <div class="buttons">
      <a href="/signup" class="btn btn-signin">Sign In</a>
      <a href="/signup" class="btn btn-primary">Get Started Free</a>
    </div>
  </div>
  <div class="form-container">
    <h2>Login</h2>
    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <a href="/signupf">Don't have an account? Sign up</a>
  </div>
</body>
</html>
